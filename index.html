<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAKYZ | 伦敦金实战交易</title>
    <style>
        :root {
            --bg: #050608;
            --gold: #d4af37;
            --gold-bright: #f9e29d;
            --white: #ffffff;
            --gray: #8b949e;
        }
        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            line-height: 1.6;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        header {
            text-align: center;
            padding: 80px 0 40px;
            background: radial-gradient(circle at top, #1a1c23 0%, var(--bg) 80%);
        }
        .logo {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to bottom, var(--gold-bright), var(--gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin: 0;
            letter-spacing: -2px;
        }
        .chart-box {
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.15);
            margin-bottom: 40px;
            background: #161b22;
            height: 500px;
        }
        .logic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }
        .logic-card {
            background: #0d1117;
            padding: 25px;
            border-radius: 8px;
            border-left: 4px solid var(--gold);
        }
        .logic-card h3 { color: var(--gold); margin-top: 0; }
        .logic-card p { color: var(--gray); font-size: 0.9rem; }
        .cta-section {
            text-align: center;
            padding: 60px 20px;
            background: rgba(255,255,255,0.02);
            border-radius: 15px;
            margin: 40px 0;
        }
        .button-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }
        .btn-yt {
            background: var(--gold);
            color: #000;
            padding: 18px 40px;
            font-size: 1.1rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 5px;
            transition: 0.3s;
        }
        .btn-yt:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }
        .wx-box {
            background: #161b22;
            border: 1px solid #333;
            padding: 15px 25px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .copy-btn {
            background: #333;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        footer {
            padding: 60px 0;
            text-align: center;
            border-top: 1px solid #21262d;
            color: #484f58;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

<header>
    <div class="container">
        <h1 class="logo">REAKYZ</h1>
        <p style="color: var(--gold); font-weight: bold; letter-spacing: 5px;">XAUUSD 价格行为狙击手</p>
    </div>
</header>

<div class="container">
    <div class="chart-box">
        <div id="tradingview_xau" style="height: 100%;"></div>
        <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
        <script type="text/javascript">
            new TradingView.widget({
                "autosize": true,
                "symbol": "OANDA:XAUUSD",
                "interval": "30",
                "timezone": "Asia/Shanghai",
                "theme": "dark",
                "style": "1",
                "locale": "zh_CN",
                "container_id": "tradingview_xau"
            });
        </script>
    </div>

    <div class="logic-grid">
        <div class="logic-card">
            <h3>01. 价格行为 (PA)</h3>
            <p>摒弃滞后指标。关注 K 线形态与关键位互动，捕捉真实动作。</p>
        </div>
        <div class="logic-card">
            <h3>02. 流动性清算</h3>
            <p>识别机构洗盘行为。在散户止损位寻找反向入场机会。</p>
        </div>
        <div class="logic-card">
            <h3>03. 严苛盈亏比</h3>
            <p>只执行盈亏比 > 3:1 的计划。利用小级别精准入场博取趋势收益。</p>
        </div>
    </div>

    <div class="cta-section">
        <h3 style="margin-top:0;">加入 REAKYZ 实战交易圈</h3>
        <div class="button-group">
            <a href="https://www.youtube.com/@reakyz?sub_confirmation=1" target="_blank" class="btn-yt">订阅 YouTube 频道</a>
            <div class="wx-box">
                <span style="color: var(--gray);">WeChat:</span>
                <span style="font-weight: bold; color: var(--gold-bright);">cz213200</span>
                <button class="copy-btn" onclick="copyWX()">复制</button>
            </div>
        </div>
        <p style="margin-top: 25px; color: var(--gold); font-size: 0.9rem;">添加请备注：实战交流</p>
    </div>
</div>

<footer>
    <p>风险提示：黄金交易具有极高风险，内容仅供参考。&copy; 2026 REAKYZ TRADING.</p>
</footer>

<script>
    function copyWX() {
        const wxID = 'cz213200';
        navigator.clipboard.writeText(wxID).then(() => {
            alert('微信号 ' + wxID + ' 已复制！');
        });
    }
</script>

</body>
</html>
